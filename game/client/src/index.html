<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Walker</title>
  </head>
  <body>
    <!-- Pixel icon sprite sheet (inline, crisp edges) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="ico-man" viewBox="0 0 16 16" shape-rendering="crispEdges">
          <rect x="6" y="1" width="4" height="4" fill="#111"/>
          <rect x="7" y="5" width="2" height="1" fill="#111"/>
          <rect x="5" y="6" width="6" height="6" fill="#111"/>
          <rect x="3" y="7" width="2" height="4" fill="#111"/>
          <rect x="11" y="7" width="2" height="4" fill="#111"/>
          <rect x="5" y="12" width="2" height="3" fill="#111"/>
          <rect x="9" y="12" width="2" height="3" fill="#111"/>
        </symbol>
        <symbol id="ico-water" viewBox="0 0 16 16" shape-rendering="crispEdges">
          <rect x="2" y="2" width="12" height="12" fill="#b3e5fc"/>
          <rect x="2" y="4" width="12" height="1" fill="#90caf9"/>
        </symbol>
        <symbol id="ico-plank" viewBox="0 0 16 16" shape-rendering="crispEdges">
          <rect x="3" y="7" width="10" height="3" fill="#6d4c41"/>
          <rect x="3" y="6" width="10" height="1" fill="#8d6e63"/>
        </symbol>
        <symbol id="ico-wall" viewBox="0 0 16 16" shape-rendering="crispEdges">
          <rect x="2" y="2" width="12" height="12" fill="#9e9e9e"/>
          <rect x="2" y="2" width="12" height="1" fill="#616161"/>
          <rect x="2" y="2" width="12" height="12" fill="none" stroke="#424242" stroke-width="1"/>
        </symbol>
        <symbol id="ico-slots" viewBox="0 0 16 16" shape-rendering="crispEdges">
          <rect x="2" y="6" width="5" height="5" fill="#ddd" stroke="#111" stroke-width="1"/>
          <rect x="9" y="6" width="5" height="5" fill="#ddd" stroke="#111" stroke-width="1"/>
        </symbol>
        <symbol id="ico-grab" viewBox="0 0 16 16" shape-rendering="crispEdges">
          <rect x="5" y="5" width="6" height="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
        </symbol>
        <symbol id="ico-craft" viewBox="0 0 16 16" shape-rendering="crispEdges">
          <rect x="7" y="3" width="2" height="10" fill="#111"/>
          <rect x="3" y="7" width="10" height="2" fill="#111"/>
        </symbol>
        <symbol id="ico-remove" viewBox="0 0 16 16" shape-rendering="crispEdges">
          <rect x="4" y="4" width="8" height="8" fill="#ffcdd2"/>
          <rect x="4" y="4" width="8" height="8" fill="none" stroke="#b71c1c" stroke-width="1"/>
          <rect x="5" y="5" width="6" height="6" fill="#b71c1c"/>
          <rect x="6" y="5" width="4" height="6" fill="#ffcdd2"/>
        </symbol>
      </defs>
    </svg>
    
    <canvas id="game" aria-label="Pixel Walker"></canvas>
    <div id="hint">Arrow keys to walk · E to grab/place · 1/2 to switch slot · C to craft · Place wood/planks to cross rivers</div>
    <script type="module" src="/index.ts"></script>
  </body>
  </html>
